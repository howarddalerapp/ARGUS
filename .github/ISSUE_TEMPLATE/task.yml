name: Task
about: Create a task for the ARGUS project (implementation step, contractor work, procurement)
title: "[Task] "
labels: task
assignees: ''

body:
  - type: markdown
    attributes:
      value: "Please fill in the details for this task. Use clear acceptance criteria."
  - type: input
    id: description
    attributes:
      label: Description
      description: Describe the work to be done
      placeholder: "Install UNVR and configure cameras"
  - type: input
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How will we know this task is done?
  - type: dropdown
    id: phase
    attributes:
      label: Project phase
      options:
        - Phase 1
        - Phase 2
        - Phase 3
