name: Render Mermaid Diagrams

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check Node (runner)
        run: |
          echo "--- Node on runner ---"
          node -v || echo "node not installed on runner"
          npm -v || echo "npm not installed on runner"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Ensure Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Render mermaid diagrams
        run: |
          python3 tools/render_mermaid.py --render

      - name: Commit generated SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/mermaid/*.svg || true
          git commit -m "Render mermaid diagrams (CI)" || echo "No changes to commit"
          git push
