name: Build search index

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Check Node (runner)
        run: |
          echo "--- Node on runner ---"
          node -v || echo "node not installed on runner"
          npm -v || echo "npm not installed on runner"
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
      - name: Build search index
        run: |
          python tools/build_search_index.py
      - name: Commit search index
        run: |
          git config user.name 'github-actions'
          git config user.email 'actions@github.com'
          git add docs/search_index.json || true
          git commit -m 'Auto-build search index' || echo 'no changes'
          git push origin main || echo 'push failed'
