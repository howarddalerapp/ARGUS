name: Create issues from tracker

on:
  workflow_dispatch: {}

jobs:
  create:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Check Node (runner)
        run: |
          echo "--- Node on runner ---"
          node -v || echo "node not installed on runner"
          npm -v || echo "npm not installed on runner"
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install requests
        run: python -m pip install requests
      - name: Create issues (dry run)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          python tools/create_issues_from_tracker.py
