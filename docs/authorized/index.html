<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/ARGUS/style.css">
<title>ARGUS — Authorized</title>
<body>
  <header class="site-header">
    <div class="container inner">
      <div class="brand">
  <img src="/ARGUS/assets/argus_logo_180.png" alt="ARGUS logo">
        <div>
          <h1>ARGUS — Authorized</h1>
          <p class="tag">Authorized engineering documentation</p>
        </div>
      </div>
      <nav class="top-nav">
  <a href="/ARGUS/index.html">Public site</a>
      </nav>
    </div>
  </header>
  <div class="container site-wrap">
    <div class="main doc-body">
      <h1>Authorized Documents</h1>
      <p class="small">This section is for authorized users only. A client-side gate protects casual discovery — for full protection, serve behind an authenticated site or VPN.</p>
      <p><button id="enter">Enter access code</button></p>
      <div id="result"></div>
    </div>
  </div>
<script>
const code = 'ARGUS-2026'; // changeable secret — client-side only
const btn = document.getElementById('enter');
const result = document.getElementById('result');
btn.addEventListener('click', ()=>{
  const v = prompt('Enter access code');
  if(!v) return;
  if(v.trim()===code){
  result.innerHTML = '<p><a href="/ARGUS/authorized/network_architecture.html">Open Network Architecture</a></p>';
  } else {
    result.innerText = 'Access denied.';
  }
});
</script>
</body>
